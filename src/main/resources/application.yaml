spring:
  application:
    name: offer-tracker
  datasource:
    url: jdbc:postgresql://localhost:5432/offer-tracker
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60
  ai:
    base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemini-3.5-flash-lite}